<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> formulario.html </title>
</head>
<body>

    <h2>Informações</h2>
    <label for="nome">Nome:</label>
<input type="text" name="nome" placeholder="Nome completo">

<br>
<br>


<Label for="Email">Email:</Label>
<input type="email " placeholder="Email">

<br>
<br>

<label for="Senha">Senha:</label>
    <input type="password" placeholder="Senha">
    <br>
    <br>

    <h2>Dados Pessoais</h2>
    <Label for="Data">Data de Nascimento:</Label>
<input type="date" placeholder="Data de nascimento">
<br>
<br>

<label for="idade">Idade:</label>
<input type="number" min="0" max="120">
<br>
<br>

<label for="Cor preferida">Cor preferida:</label>
<input type="color" placeholder="cor preferida">
<br>
<br>

<h2> Dados de preferência</h2>
<label for="genêro">Genêro:</label>
<input type="radio" name="genêro" value="masculino"> Masculino
<input type="radio" name="genêro" value="feminino"> Feminino
<input type="radio" name="genêro" value="prefiro não dizer"> outros
<br>
<br>
<label for="Hobbies">Hobbies:</label>
<input type="checkbox" name="hobbies" value="praia"> praia
<input type="checkbox" name="hobbies" value="dormir">dormir
<input type="checkbox" name="hobbies" value="comer">comer
<br>
<br>

<label for="arquivo">arquivo:</label>
<input type="file" name="arquivo">


</body>
</html>
